{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-key"></i> Đổi mật khẩu</h4>
<form method="post" class="card" style="max-width: 480px;">{{ csrf_field() }}<div class="card-body">
  <div class="mb-3"><label class="form-label">Mật khẩu hiện tại</label><input class="form-control" type="password" name="current" required autocomplete="current-password"></div>
  <div class="mb-3"><label class="form-label">Mật khẩu mới (≥ 8 ký tự)</label><input class="form-control" type="password" name="new" required minlength="8" autocomplete="new-password"></div>
  <div class="mb-3"><label class="form-label">Nhập lại mật khẩu mới</label><input class="form-control" type="password" name="confirm" required autocomplete="new-password"></div>
  <button class="btn btn-primary"><i class="bi bi-save"></i> Đổi mật khẩu</button>
</div></form>
{% endblock %}
